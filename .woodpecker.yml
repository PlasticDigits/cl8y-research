when:
  - event: [push, manual, pull_request]

steps:
  - name: cargo
    image: rust:1.88-bookworm
    commands:
      - cargo test --workspace --locked
  - name: no-catchall-codeowners
    image: alpine:3.20
    commands:
      - test ! -f CODEOWNERS
      - test ! -f docs/CODEOWNERS
      - test ! -f .forgejo/CODEOWNERS
