[package]
name = "cl8y-research"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "CL8Y ecosystem research worker: weekly blog drafts and vector search"
repository = "https://gitlab.com/PlasticDigits/cl8y-research"
rust-version = "1.80"

[features]
default = []
postgres = ["dep:sqlx", "dep:pgvector", "dep:tokio"]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
pgvector = { version = "0.4", optional = true, features = ["sqlx"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
sqlx = { version = "0.8", optional = true, default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json"] }
thiserror = "2"
tokio = { version = "1", optional = true, features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "cl8y-research"
path = "src/main.rs"
