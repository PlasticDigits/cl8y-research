services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: cl8y
      POSTGRES_PASSWORD: cl8y
      POSTGRES_DB: cl8y_research
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cl8y -d cl8y_research"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
